[package]
name = "reverie"
version = "0.3.2"
edition = "2021"
description = "A UFO dogfight in your terminal, flown by two small local language models (CUDA or Apple MLX); optional idle-screensaver mode."
license = "MIT"
readme = "README.md"
keywords = ["terminal", "screensaver", "tui", "ascii-art", "animation"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # panic hook still restores the terminal before abort
overflow-checks = true  # integer overflow aborts (after restoring the terminal) instead of wrapping silently
strip = true
