[package]
name = "reverie"
version = "0.2.0"
edition = "2021"
description = "A tiny terminal screensaver: UFO dogfights over a sleeping city, flown by built-in pilots or by two small language models. Wakes when your shell sits idle."
license = "MIT"
readme = "README.md"
keywords = ["terminal", "screensaver", "tui", "ascii-art", "animation"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # panic hook still restores the terminal before abort
strip = true
