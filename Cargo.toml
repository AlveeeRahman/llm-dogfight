[package]
name = "llm-dogfight"
version = "0.5.0"
edition = "2021"
description = "A terminal UFO dogfight between two local LLMs: small open models command rival saucer teams on CUDA, Apple MLX or CPU."
license = "MIT"
readme = "README.md"
homepage = "https://alveeerahman.github.io/llm-dogfight/"
repository = "https://github.com/AlveeeRahman/llm-dogfight"
keywords = ["llm", "terminal", "game", "local-llm", "tui"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "dogfight"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"   # panic hook still restores the terminal before abort
overflow-checks = true  # integer overflow aborts (after restoring the terminal) instead of wrapping silently
strip = true
