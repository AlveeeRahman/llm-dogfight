name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only token for every job; the release job alone raises it to contents: write.
permissions:
  contents: read

jobs:
  test:
    name: lint, build, bench, pty harness (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y python3-pil python3-numpy
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check                     # formatting is enforced
      - run: cargo clippy --release -- -D warnings # every lint is an error (incl. undocumented unsafe)
      - run: cargo install cargo-audit --locked && cargo audit   # RustSec advisories (1 dependency: libc)
      - run: cargo build --release --locked
      - run: sudo cp target/release/dogfight /usr/local/bin/
      - run: dogfight bench --size 200x55 --frames 600 | tee bench.jsonl
      - run: python3 eval/check_bench.py bench.jsonl
      - run: python3 eval/test_terminal.py          # pty harness: start, key exit, screen/termios restore, SIGTERM
      - run: python3 eval/test_arena.py             # sidecar prompt/parse/lessons, no GPU needed
      - run: pip install --quiet bandit ruff && bandit -q -r agents/ scripts/ && ruff check agents/ eval/test_arena.py scripts/

  macos:
    name: build and GPU-free checks (Apple silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo build --release --locked
      - run: ./target/release/dogfight bench --size 200x55 --frames 300 | tee bench.jsonl
      - run: python3 eval/check_bench.py bench.jsonl
      - run: python3 eval/test_arena.py

  release:
    name: release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          dir="dogfight-${v}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/dogfight" README.md LICENSE SECURITY.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2, SHA-pinned: this step holds the only write permission
        with:
          files: |
            dogfight-*.tar.gz
            dogfight-*.tar.gz.sha256
          generate_release_notes: true
