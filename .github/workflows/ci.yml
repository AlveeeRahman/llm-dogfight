name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh fish python3-pil python3-numpy
      - run: cargo fmt --check                     # formatting is enforced
      - run: cargo clippy --release -- -D warnings # every lint is an error
      - run: cargo install cargo-audit --locked && cargo audit   # RustSec advisories (1 dependency: libc)
      - run: cargo build --release --locked
      - run: sudo cp target/release/reverie /usr/local/bin/
      - run: reverie bench --size 200x55 --frames 600 | tee bench.jsonl
      - run: python3 eval/check_bench.py bench.jsonl
      - run: python3 eval/test_terminal.py
      - run: python3 eval/test_arena.py          # sidecar parsing/lessons, no GPU needed
      - run: pip install --quiet bandit ruff && bandit -q -r agents/ && ruff check agents/ eval/test_arena.py
  macos:
    runs-on: macos-latest                          # Apple silicon: builds + the GPU-free checks
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: ./target/release/reverie bench --size 200x55 --frames 300 | tee bench.jsonl
      - run: python3 eval/check_bench.py bench.jsonl
      - run: python3 eval/test_arena.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    strategy:
      matrix: { target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl] }
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cross && cross build --release --target ${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with: { files: "target/${{ matrix.target }}/release/reverie" }
