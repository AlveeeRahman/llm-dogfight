name: models
# The catalogue is only useful while its models stay public and loadable. Once a week (and on
# demand) fetch the two defaults from Hugging Face on a CPU runner: a model that goes gated,
# renamed or private shows up here before users hit it. Uses the HF_TOKEN secret when one is
# set (higher rate limit); works without it.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  pull-defaults:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet huggingface_hub
      - name: default pair is public and complete
        run: python3 agents/arena.py --pull
      - name: catalogue entries are public
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request, os, sys
          src = open("src/main.rs").read()
          ids = re.findall(r'\("([a-z0-9.\-]+)", "([^"]+)", ([0-9.]+), "[^"]*"\)', src)
          bad = []
          hdr = {"Authorization": f"Bearer {os.environ['HF_TOKEN']}"} if os.environ.get("HF_TOKEN") else {}
          for alias, mid, gb in ids:
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(f"https://huggingface.co/api/models/{mid}", headers=hdr), timeout=30))
                  if d.get("gated") or d.get("private"):
                      bad.append(f"{alias} ({mid}) is gated/private")
              except Exception as e:
                  bad.append(f"{alias} ({mid}): {e}")
          print("\n".join(f"ok {a} {m}" for a, m, _ in ids))
          if bad:
              print("\n".join(bad)); sys.exit(1)
          EOF
