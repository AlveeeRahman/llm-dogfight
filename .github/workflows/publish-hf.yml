name: publish to hugging face
# Continuous delivery to the Hugging Face Space: the README becomes the Space card and a
# rendered page, and the release tarballs (built by ci.yml's release job) are mirrored under
# releases/<tag>/. Runs when a GitHub release is published and on demand.
#
# Secrets are scoped to single steps: the GitHub token only to the asset download, the Hugging
# Face token only to the final upload, which runs after every dependency has been installed
# from the hash-pinned set in .github/requirements-hf.txt and after the site has been built.
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to mirror (e.g. v0.5.0); empty = site only
        required: false
        default: ""

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install pinned dependencies (no secrets in this step)
        run: python3 -m pip install --quiet --require-hashes -r .github/requirements-hf.txt
      - name: fetch release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "no tag: publishing the site only"
            exit 0
          fi
          mkdir -p assets
          # A tag means the release assets are required: a failed download fails the job.
          gh release download "$tag" --repo "${{ github.repository }}" --dir assets --pattern 'dogfight-*'
          n=$(find assets -name 'dogfight-*.tar.gz' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::release $tag has no dogfight-*.tar.gz asset; has ci.yml's release job finished?"
            exit 1
          fi
          ls -la assets
      - name: build the site (no secrets in this step)
        run: python3 scripts/publish_hf.py build --out site
      - name: upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then echo "::error::HF_TOKEN secret is not set"; exit 1; fi
          python3 scripts/publish_hf.py upload --site site --tag "${{ steps.assets.outputs.tag }}" --assets assets
