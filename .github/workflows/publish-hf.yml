name: publish to hugging face
# Continuous delivery to the Hugging Face Space: the README becomes the Space card and a
# rendered page, and the release tarballs (built by ci.yml's release job) are mirrored under
# releases/<tag>/. Runs when a GitHub release is published and on demand.
on:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to mirror (e.g. v0.4.1); empty = site only
        required: false
        default: ""

jobs:
  space:
    runs-on: ubuntu-24.04
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet huggingface_hub markdown
      - name: fetch release assets
        id: assets
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            mkdir -p assets
            gh release download "$tag" --repo "${{ github.repository }}" --dir assets --pattern 'dogfight-*' || true
            ls -la assets
          fi
      - name: publish
        run: python3 scripts/publish_hf.py --tag "${{ steps.assets.outputs.tag }}" --assets assets
